services:
  booking-bot:
    # И image, и build сразу — совмещает два сценария одним файлом:
    #   - вручную на сервере (`docker compose up -d --build`, см. README) —
    #     собирается из Dockerfile локально, как и раньше;
    #   - автодеплой из GitHub Actions (.github/workflows/deploy.yml) —
    #     `docker compose pull` тянет уже собранный на раннере образ под
    #     этим тегом, `up -d` без --build запускает его без пересборки на
    #     самом VDS.
    # Тег должен совпадать с IMAGE в deploy.yml.
    image: ghcr.io/alex-aka-ion/timely:latest
    build: .
    container_name: booking-bot
    restart: unless-stopped
    # Все настройки (BOT_TOKEN, TEACHER_TELEGRAM_ID, TZ и т.д.) — в .env
    # рядом с этим файлом, см. .env.example. .env в образ не копируется
    # (см. .dockerignore) — только подставляется как переменные окружения
    # процесса при старте контейнера, секреты в слоях образа не оседают.
    env_file:
      - .env
    volumes:
      # SQLite-база — единственное, что должно пережить пересоздание
      # контейнера. ./data на хосте нужно создать и chown'ить на UID/GID
      # 10001 ДО первого запуска (см. README) — иначе bind mount достанется
      # от хостового root, и процесс внутри контейнера (не root) не
      # сможет в него писать.
      - ./data:/app/data
      # credentials.json — ключ service account (см. README, раздел "Google
      # Calendar API"): token.json и `--auth` ему не нужны, поэтому файл
      # token.json здесь не монтируется — иначе при его отсутствии Docker
      # сам создал бы на его месте пустую директорию. Если вы остаётесь на
      # OAuth-клиенте (Desktop app), добавьте строку
      #   - ./token.json:/app/token.json:ro
      # и положите token.json рядом (получается локально через `--auth`).
      - ./credentials.json:/app/credentials.json:ro
    # Ни один порт не публикуется — бот не принимает входящих запросов
    # (см. Dockerfile).
