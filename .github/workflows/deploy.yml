name: Deploy

# Каждый push в main: тесты → сборка образа в GHCR → перезапуск на VDS.
# Ручного шага нет — именно это и означает "автодеплой после коммита".
on:
  push:
    branches: [main]

# Важно держать в нижнем регистре и в одном виде с `image:` в
# docker-compose.yml — Docker не разрешает заглавные буквы в имени образа,
# а github.repository приходит как есть (Alex-aka-ion/Timely).
env:
  IMAGE: ghcr.io/alex-aka-ion/timely

jobs:
  # Тот же набор проверок, что и локально (см. Makefile) — падение здесь
  # останавливает пайплайн раньше, чем сборка и деплой образа.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -race -count=1

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # публикация в ghcr.io этим же токеном, без отдельного PAT
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest — то, что тянет сервер; :<sha> — на случай если
          # понадобится откатиться на конкретную версию образа руками.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Только pull + up -d — никакой сборки на самом VDS: образ уже
      # собран на раннере GitHub, сервер должен просто перезапуститься
      # на новом. docker-compose.yml лежит в /opt/booking-bot заранее
      # (см. README) — сюда клонируется тот же репозиторий один раз при
      # первоначальной настройке.
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/booking-bot
            docker compose pull
            docker compose up -d
            docker image prune -f
